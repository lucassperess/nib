<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nib</title>
  <link rel="stylesheet" href="popup.css" />
  <script defer src="popup.js"></script>
</head>
<body>
  <main>
    <h1>Nib <span id="subtitle"></span></h1>
    <p id="intro"></p>
    <label for="service" id="service-label"></label>
    <select id="service"><option value="youtube">YouTube</option><option value="instagram">Instagram</option><option value="twitter">X</option></select>
    <label for="code" id="code-label"></label>
    <input id="code" inputmode="text" autocomplete="off" maxlength="12" spellcheck="false" />
    <button id="send" type="button"></button>
    <p id="status" role="status" aria-live="polite"></p>
    <small id="privacy"></small>
  </main>
</body>
</html>
